<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TabiPlan - 旅程・Googleマップ連携・割り勘管理</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Supabase JS CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased min-h-screen">
  <div id="app" class="max-w-md mx-auto min-h-screen bg-slate-50 shadow-xl pb-16 flex flex-col">
    <!-- Header -->
    <header class="bg-white border-b border-slate-200 px-4 py-3 sticky top-0 z-30 flex items-center justify-between shadow-2xs">
      <div class="flex items-center gap-2 cursor-pointer" onclick="navigate('home')">
        <div class="w-8 h-8 rounded-xl bg-sky-500 text-white flex items-center justify-center font-black shadow-sm">
          <i data-lucide="compass" class="w-5 h-5"></i>
        </div>
        <div>
          <div class="flex items-center gap-1.5">
            <h1 class="font-black text-sm tracking-tight text-slate-800 leading-none">TabiPlan</h1>
            <span class="text-[9px] bg-emerald-100 text-emerald-800 px-1.5 py-0.2 rounded-full font-bold">v5.0（Supabaseクラウドリアルタイム同期対応版）</span>
          </div>
          <span class="text-[10px] text-slate-400 font-medium">旅程・マップ・割り勘精算</span>
        </div>
      </div>
      <div id="header-actions" class="flex items-center gap-1.5"></div>
    </header>

    <!-- Main Content Area -->
    <main id="main-content" class="flex-1 p-4"></main>
  </div>

  <!-- Global Modal Container -->
  <div id="modal-container" class="hidden fixed inset-0 z-50 bg-black/50 flex items-center justify-center p-4"></div>

  <!-- App Script -->
  <script>
    // --- Preset Cities Data ---
    const PRESETS = {
      '福井': [

        { name: '名古屋駅', category: 'transit', duration: 20, cost: 0, memo: '特急しらさぎに乗換', travel_mode: 'transit' },
        { name: '敦賀駅', category: 'transit', duration: 30, cost: 0, memo: 'レンタカー受取・ドライブ出発', travel_mode: 'driving' },
        { name: '東尋坊', category: 'sightseeing', duration: 90, cost: 500, memo: '日本海の断崖絶壁と海鮮ランチ', travel_mode: 'driving' },
        { name: '福井駅', category: 'transit', duration: 60, cost: 0, memo: '駅前恐竜広場・お土産購入', travel_mode: 'driving' }
      ],
      '京都': [
        { name: '清水寺', category: 'sightseeing', duration: 90, cost: 400, memo: '舞台からの眺望と音羽の滝', travel_mode: 'transit' },
        { name: '錦市場', category: 'food', duration: 60, cost: 2000, memo: '京都の台所で食べ歩きランチ', travel_mode: 'walking' },
        { name: '金閣寺', category: 'sightseeing', duration: 60, cost: 500, memo: '舎利殿の金箔の輝きを鑑賞', travel_mode: 'transit' },
        { name: '伏見稲荷大社', category: 'sightseeing', duration: 90, cost: 0, memo: '千本鳥居の参道散策', travel_mode: 'transit' }
      ],
      '金沢': [
        { name: '兼六園', category: 'sightseeing', duration: 90, cost: 320, memo: '日本三名園の回遊式庭園', travel_mode: 'walking' },
        { name: '近江町市場', category: 'food', duration: 60, cost: 2500, memo: '新鮮な海鮮丼ランチ', travel_mode: 'walking' },
        { name: '金沢21世紀美術館', category: 'sightseeing', duration: 90, cost: 1200, memo: 'スイミング・プールなど現代アート', travel_mode: 'walking' },
        { name: 'ひがし茶屋街', category: 'sightseeing', duration: 60, cost: 1000, memo: '風情ある茶屋建築と金箔スイーツ', travel_mode: 'transit' }
      ],
      '仙台': [
        { name: '仙台城跡', category: 'sightseeing', duration: 60, cost: 0, memo: '伊達政宗公騎馬像と市内展望', travel_mode: 'transit' },
        { name: '仙台牛たん通り', category: 'food', duration: 60, cost: 2200, memo: '炭火焼きの極上牛たん定食', travel_mode: 'walking' },
        { name: '瑞鳳殿', category: 'sightseeing', duration: 60, cost: 570, memo: '豪華絢爛な桃山様式の霊屋', travel_mode: 'transit' },
        { name: '松島海岸・五大堂', category: 'sightseeing', duration: 120, cost: 1500, memo: '日本三景松島の遊覧船巡り', travel_mode: 'transit' }
      ],
      '沖縄': [
        { name: '美ら海水族館', category: 'sightseeing', duration: 120, cost: 2180, memo: '黒潮の海大水槽のジンベエザメ', travel_mode: 'driving' },
        { name: '国際通り', category: 'shopping', duration: 90, cost: 3000, memo: 'お土産散策と沖縄そば', travel_mode: 'walking' },
        { name: '万座毛', category: 'sightseeing', duration: 45, cost: 100, memo: 'エメラルドグリーンの断崖絶景', travel_mode: 'driving' }
      ],
      '東京': [
        { name: '浅草寺・雷門', category: 'sightseeing', duration: 75, cost: 0, memo: '仲見世通りと参拝', travel_mode: 'transit' },
        { name: '築地場外市場', category: 'food', duration: 60, cost: 2500, memo: '名物海鮮丼や玉子焼き', travel_mode: 'transit' },
        { name: '東京スカイツリー', category: 'sightseeing', duration: 90, cost: 2100, memo: '展望デッキからの眺望', travel_mode: 'transit' }
      ]
    };

    // --- State Management ---
    let currentView = 'home';
    let currentTripId = null;
    let activeDay = 1;
    let activeTab = 'timeline'; // 'timeline' | 'warikan'
    let warikanSubTab = 'expenses'; // 'expenses' | 'lendings' | 'settlement' | 'members'
    let creationMembers = ['自分', '彼女'];

    // --- Supabase Cloud Client State ---
    let supabaseClient = null;
    let activeRealtimeChannel = null;

    function initSupabase() {
      const url = localStorage.getItem('tabiplan_sb_url');
      const key = localStorage.getItem('tabiplan_sb_key');
      if (url && key && window.supabase) {
        try {
          supabaseClient = window.supabase.createClient(url.trim(), key.trim());
          return true;
        } catch (e) {
          console.warn('Supabase init error:', e);
          supabaseClient = null;
          return false;
        }
      }
      supabaseClient = null;
      return false;
    }

    function isCloudSyncEnabled() {
      return !!supabaseClient;
    }

    // --- LocalStorage Helpers ---
    function getStoredTrips() {
      try {
        return JSON.parse(localStorage.getItem('tabiplan_trips') || '[]');
      } catch (e) { return []; }
    }
    function setStoredTrips(trips) {
      localStorage.setItem('tabiplan_trips', JSON.stringify(trips));
    }
    function getTripData(id) {
      try {
        const trip = JSON.parse(localStorage.getItem(`trip_${id}`));
        const members = JSON.parse(localStorage.getItem(`members_${id}`) || '[]');
        const spots = JSON.parse(localStorage.getItem(`spots_${id}`) || '[]');
        const expenses = JSON.parse(localStorage.getItem(`expenses_${id}`) || '[]');
        return { trip, members, spots, expenses };
      } catch (e) { return null; }
    }
    function saveTripData(id, data) {
      if (data.trip) localStorage.setItem(`trip_${id}`, JSON.stringify(data.trip));
      if (data.members) localStorage.setItem(`members_${id}`, JSON.stringify(data.members));
      if (data.spots) localStorage.setItem(`spots_${id}`, JSON.stringify(data.spots));
      if (data.expenses) localStorage.setItem(`expenses_${id}`, JSON.stringify(data.expenses));
    }

    // --- Supabase Cloud Sync Operations ---
    async function loadTripFromCloud(tokenOrId) {
      if (!supabaseClient) return null;
      try {
        // Fetch Trip
        let { data: trip, error } = await supabaseClient
          .from('trips')
          .select('*')
          .or(`share_token.eq.${tokenOrId},id.eq.${tokenOrId}`)
          .single();

        if (error || !trip) {
          console.warn('Trip fetch from cloud failed:', error);
          return null;
        }

        // Fetch related tables
        const [memRes, spotRes, expRes] = await Promise.all([
          supabaseClient.from('trip_members').select('*').eq('trip_id', trip.id),
          supabaseClient.from('spots').select('*').eq('trip_id', trip.id).order('sort_order', { ascending: true }),
          supabaseClient.from('expenses').select('*').eq('trip_id', trip.id)
        ]);

        const members = memRes.data || [];
        const spots = spotRes.data || [];
        const expenses = expRes.data || [];

        // Fetch splits if any expenses
        if (expenses.length > 0) {
          const expIds = expenses.map(e => e.id);
          const { data: splitsData } = await supabaseClient
            .from('expense_splits')
            .select('*')
            .in('expense_id', expIds);

          const splitsByExp = {};
          (splitsData || []).forEach(s => {
            if (!splitsByExp[s.expense_id]) splitsByExp[s.expense_id] = [];
            splitsByExp[s.expense_id].push(s);
          });
          expenses.forEach(e => {
            e.splits = splitsByExp[e.id] || [];
          });
        }

        // Save into local cache
        saveTripData(trip.id, { trip, members, spots, expenses });
        const localTrips = getStoredTrips().filter(t => t.id !== trip.id);
        setStoredTrips([trip, ...localTrips]);

        return trip;
      } catch (err) {
        console.error('loadTripFromCloud error:', err);
        return null;
      }
    }

    function subscribeTripRealtime(tripId) {
      if (!supabaseClient) return;
      if (activeRealtimeChannel) {
        try { supabaseClient.removeChannel(activeRealtimeChannel); } catch (e) {}
      }
      activeRealtimeChannel = supabaseClient
        .channel(`trip_realtime_${tripId}`)
        .on('postgres_changes', { event: '*', schema: 'public', filter: `trip_id=eq.${tripId}` }, async () => {
          console.log('Realtime change from companion detected! Refreshing...');
          await loadTripFromCloud(tripId);
          render();
        })
        .subscribe();
    }

    // --- Navigation Router ---
    function navigate(view, tripId = null) {
      currentView = view;
      if (tripId) {
        currentTripId = tripId;
        if (isCloudSyncEnabled()) {
          subscribeTripRealtime(tripId);
        }
      }
      closeModal();
      render();
    }

    // --- Render Views ---
    function render() {
      const container = document.getElementById('main-content');
      const headerActions = document.getElementById('header-actions');
      headerActions.innerHTML = '';

      if (currentView === 'home') {
        renderHome(container, headerActions);
      } else if (currentView === 'detail' && currentTripId) {
        renderDetail(container, headerActions);
      }
      lucide.createIcons();
    }

    // --- 1. Home View ---
    function renderHome(container, headerActions) {
      const trips = getStoredTrips();
      const cloudStatus = isCloudSyncEnabled();

      headerActions.innerHTML = `
        <button onclick="openSupabaseSettingsModal()" class="px-2.5 py-1 ${cloudStatus ? 'bg-emerald-50 text-emerald-800 border-emerald-300' : 'bg-slate-100 text-slate-600 border-slate-200'} border text-xs font-bold rounded-lg flex items-center gap-1 shadow-2xs">
          <i data-lucide="${cloudStatus ? 'cloud' : 'cloud-off'}" class="w-3.5 h-3.5 ${cloudStatus ? 'text-emerald-600' : 'text-slate-400'}"></i>
          <span>${cloudStatus ? 'クラウド同期中' : 'クラウド設定'}</span>
        </button>
      `;

      let html = `
        <div class="mb-5 text-center pt-2">
          <h2 class="text-lg font-black text-slate-800">旅行計画・割り勘マネージャー</h2>
          <p class="text-xs text-slate-500 mt-0.5">誰が・誰の・何を支払ったかをリアルタイム共有＆管理</p>
          <div class="mt-2 flex items-center justify-center gap-1 text-[11px] font-semibold ${cloudStatus ? 'text-emerald-700' : 'text-slate-400'}">
            <span class="w-2 h-2 rounded-full ${cloudStatus ? 'bg-emerald-500 animate-pulse' : 'bg-slate-300'}"></span>
            ${cloudStatus ? 'Supabase クラウド同期有効（URL共有・同時編集可能）' : 'ローカル保存モード（ヘッダーからクラウド連携可能）'}
          </div>
        </div>
      `;

      if (trips.length > 0) {
        html += `
          <div class="mb-5">
            <h3 class="text-xs font-bold text-slate-600 mb-2 flex items-center gap-1.5">
              <i data-lucide="folder-kanban" class="w-3.5 h-3.5 text-sky-500"></i>
              保存済みの旅行プラン (${trips.length}件)
            </h3>
            <div class="space-y-2">
        `;
        trips.forEach(t => {
          html += `
            <div onclick="navigate('detail', '${t.id}')" class="p-3.5 bg-white rounded-2xl border border-slate-200 shadow-2xs hover:border-sky-300 cursor-pointer flex items-center justify-between transition-colors">
              <div class="min-w-0 pr-2">
                <div class="font-bold text-slate-800 text-sm truncate">${escapeHtml(t.title)}</div>
                <div class="text-[11px] text-slate-500 flex items-center gap-2 mt-0.5">
                  <span class="text-sky-600 font-semibold flex items-center gap-0.5"><i data-lucide="map-pin" class="w-2.5 h-2.5"></i>${escapeHtml(t.destination)}</span>
                  <span>•</span>
                  <span>${t.start_date}〜</span>
                </div>
              </div>
              <div class="flex items-center gap-1 shrink-0">
                <button onclick="event.stopPropagation(); deleteTrip('${t.id}')" class="p-1.5 text-slate-400 hover:text-red-500 rounded-lg hover:bg-red-50">
                  <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                </button>
                <span class="text-xs font-bold text-sky-600 bg-sky-50 px-2.5 py-1 rounded-lg flex items-center gap-1">
                  開く <i data-lucide="chevron-right" class="w-3.5 h-3.5"></i>
                </span>
              </div>
            </div>
          `;
        });
        html += `</div></div>`;
      }

      // New Trip Form
      const today = new Date().toISOString().split('T')[0];
      html += `
        <div class="bg-white rounded-3xl p-5 shadow-sm border border-slate-200">
          <h3 class="text-xs font-bold text-slate-800 mb-3 flex items-center gap-1.5">
            <i data-lucide="plus-circle" class="w-4 h-4 text-sky-500"></i> 新しい旅行を作成
          </h3>
          <form onsubmit="handleCreateTrip(event)" class="space-y-3.5 text-xs">
            <div>
              <label class="block font-semibold text-slate-700 mb-1">目的地</label>
              <input type="text" id="form-dest" required placeholder="例: 福井、京都、金沢、仙台、沖縄、東京" value="福井" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl font-semibold text-xs focus:outline-none focus:border-sky-500">
            </div>
            <div>
              <label class="block font-semibold text-slate-700 mb-1">旅行タイトル (任意)</label>
              <input type="text" id="form-title" placeholder="例: 福井・東尋坊ドライブ旅行" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:outline-none focus:border-sky-500">
            </div>
            <div class="grid grid-cols-2 gap-2">
              <div>
                <label class="block font-semibold text-slate-700 mb-1">開始日</label>
                <input type="date" id="form-start" required value="${today}" class="w-full px-3 py-1.5 bg-slate-50 border border-slate-200 rounded-xl text-xs font-semibold focus:outline-none focus:border-sky-500">
              </div>
              <div>
                <label class="block font-semibold text-slate-700 mb-1">終了日</label>
                <input type="date" id="form-end" required value="${today}" class="w-full px-3 py-1.5 bg-slate-50 border border-slate-200 rounded-xl text-xs font-semibold focus:outline-none focus:border-sky-500">
              </div>
            </div>

            <!-- Participant Members Tag Input -->
            <div>
              <label class="block font-semibold text-slate-700 mb-1 flex items-center justify-between">
                <span>参加メンバー（割り勘・立替対象）</span>
                <span class="text-[10px] text-slate-400 font-normal">旅行作成後も追加可能</span>
              </label>
              <div id="creation-members-tags" class="flex flex-wrap gap-1.5 mb-2">
                ${creationMembers.map((m, idx) => `
                  <span class="inline-flex items-center gap-1 px-2.5 py-1 rounded-lg bg-emerald-50 text-emerald-800 border border-emerald-200 font-bold text-xs">
                    <i data-lucide="user" class="w-3 h-3 text-emerald-600"></i> ${escapeHtml(m)}
                    ${creationMembers.length > 1 ? `
                      <button type="button" onclick="removeCreationMember(${idx})" class="hover:text-red-500 ml-0.5">
                        <i data-lucide="x" class="w-3 h-3"></i>
                      </button>
                    ` : ''}
                  </span>
                `).join('')}
              </div>
              <div class="flex gap-1.5">
                <input type="text" id="new-member-input" placeholder="メンバー名を追加（例: Aさん）" class="flex-1 px-3 py-1.5 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:outline-none focus:border-sky-500">
                <button type="button" onclick="addCreationMember()" class="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl font-bold text-xs flex items-center gap-1 shadow-2xs">
                  <i data-lucide="plus" class="w-3.5 h-3.5"></i> 追加
                </button>
              </div>
            </div>

            <div class="pt-1">
              <label class="flex items-center gap-2 p-2.5 rounded-xl border border-slate-200 bg-slate-50 cursor-pointer">
                <input type="checkbox" id="form-preset" checked class="rounded text-sky-600">
                <div>
                  <span class="font-bold text-slate-700">主要観光・交通スポットを初期セットする</span>
                  <div class="text-[10px] text-slate-400">東京〜敦賀（電車）や敦賀〜東尋坊（車）などの代表枠を自動登録</div>
                </div>
              </label>
            </div>
            <button type="submit" class="w-full mt-2 py-3 bg-sky-500 hover:bg-sky-600 text-white rounded-xl font-bold text-xs flex items-center justify-center gap-1.5 shadow-sm transition-colors">
              旅行プランを作成して開始 <i data-lucide="arrow-right" class="w-3.5 h-3.5"></i>
            </button>
          </form>

          <div class="mt-4 pt-3 border-t border-slate-100 flex items-center justify-between text-[11px] text-slate-400">
            <span>JSONバックアップ復元</span>
            <label class="cursor-pointer font-bold text-sky-600 hover:underline flex items-center gap-1">
              <i data-lucide="upload" class="w-3 h-3"></i> ファイル選択
              <input type="file" accept=".json" onchange="handleImportBackup(event)" class="hidden">
            </label>
          </div>
        </div>
      `;
      container.innerHTML = html;
    }

    function addCreationMember() {
      const input = document.getElementById('new-member-input');
      const val = input.value.trim();
      if (!val) return;
      if (!creationMembers.includes(val)) {
        creationMembers.push(val);
      }
      input.value = '';
      render();
    }
    function removeCreationMember(idx) {
      creationMembers.splice(idx, 1);
      render();
    }

    // --- 2. Detail View ---
    function renderDetail(container, headerActions) {
      const data = getTripData(currentTripId);
      if (!data || !data.trip) {
        navigate('home');
        return;
      }
      const { trip, members, spots, expenses } = data;
      const cloudStatus = isCloudSyncEnabled();

      // Header Actions: Copy Share URL & Cloud Status
      headerActions.innerHTML = `
        <button onclick="copyShareUrl()" class="px-2.5 py-1 bg-sky-500 hover:bg-sky-600 text-white text-xs font-bold rounded-lg flex items-center gap-1 shadow-2xs transition-colors">
          <i data-lucide="share-2" class="w-3 h-3"></i> 共有URL
        </button>
        <button onclick="openSupabaseSettingsModal()" class="px-2 py-1 ${cloudStatus ? 'bg-emerald-50 text-emerald-800' : 'bg-slate-100 text-slate-600'} text-xs font-bold rounded-lg flex items-center gap-1" title="クラウド設定">
          <i data-lucide="${cloudStatus ? 'cloud' : 'cloud-off'}" class="w-3 h-3 ${cloudStatus ? 'text-emerald-600' : 'text-slate-400'}"></i>
        </button>
        <button onclick="navigate('home')" class="px-2.5 py-1 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold rounded-lg flex items-center gap-1">
          <i data-lucide="home" class="w-3 h-3"></i> 一覧
        </button>
      `;

      // Calculate total days
      const start = new Date(trip.start_date);
      const end = new Date(trip.end_date);
      const totalDays = Math.max(1, Math.ceil(Math.abs(end.getTime() - start.getTime()) / (1000 * 60 * 60 * 24)) + 1);
      if (activeDay > totalDays) activeDay = 1;

      // Filter day spots
      const daySpots = spots.filter(s => s.day_number === activeDay).sort((a, b) => a.sort_order - b.sort_order);

      // Calculations
      const totalExpense = expenses.reduce((sum, e) => sum + e.amount, 0);
      const totalBudget = spots.reduce((sum, s) => sum + (s.cost_estimate || 0), 0);
      const budgetDiff = totalBudget - totalExpense;

      let html = `
        <!-- Trip Info Card -->
        <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200/80 mb-3">
          <div class="flex items-start justify-between">
            <div>
              <h2 class="text-base font-black text-slate-800">${escapeHtml(trip.title)}</h2>
              <div class="flex flex-wrap items-center gap-2 mt-1.5 text-xs text-slate-500 font-medium">
                <span class="text-sky-700 font-bold bg-sky-50 px-2 py-0.5 rounded-md flex items-center gap-1">
                  <i data-lucide="map-pin" class="w-3 h-3 text-sky-500"></i> ${escapeHtml(trip.destination)}
                </span>
                <span class="flex items-center gap-1">
                  <i data-lucide="calendar" class="w-3 h-3 text-slate-400"></i> ${trip.start_date}〜 (${totalDays}日間)
                </span>
                <button onclick="setTab('warikan'); setWarikanSubTab('members')" class="flex items-center gap-1 text-emerald-700 bg-emerald-50 hover:bg-emerald-100 px-2 py-0.5 rounded-md font-bold transition-colors">
                  <i data-lucide="users" class="w-3 h-3 text-emerald-600"></i> ${members.length}名 (管理)
                </button>
              </div>
            </div>
            <button onclick="copyShareUrl()" class="p-2 bg-sky-50 hover:bg-sky-100 text-sky-600 rounded-xl text-xs font-bold flex flex-col items-center gap-0.5 shrink-0" title="同行者に共有リンクを送る">
              <i data-lucide="share-2" class="w-4 h-4"></i>
              <span class="text-[9px]">共有</span>
            </button>
          </div>
          ${cloudStatus ? `
            <div class="mt-2.5 pt-2 border-t border-slate-100 flex items-center justify-between text-[11px] text-emerald-700">
              <span class="flex items-center gap-1"><span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span> リアルタイムクラウド同期中（相手の編集も即時反映）</span>
              <button onclick="exportBackup()" class="text-slate-400 hover:text-slate-600 text-[10px] flex items-center gap-0.5">JSON保存</button>
            </div>
          ` : `
            <div class="mt-2.5 pt-2 border-t border-slate-100 flex items-center justify-between text-[11px] text-slate-400">
              <span>ローカル保存中（端末内のみ）</span>
              <button onclick="openSupabaseSettingsModal()" class="text-sky-600 font-bold hover:underline">クラウド接続してURL共有</button>
            </div>
          `}
        </div>

        <!-- Main Tab Switcher -->
        <div class="flex bg-slate-200/80 p-1 rounded-2xl mb-3 font-bold text-xs">
          <button onclick="setTab('timeline')" class="flex-1 py-2 rounded-xl flex items-center justify-center gap-1.5 transition-all ${activeTab === 'timeline' ? 'bg-white text-sky-700 shadow-sm' : 'text-slate-600'}">
            <i data-lucide="list-ordered" class="w-3.5 h-3.5"></i> 旅程・マップ (${spots.length})
          </button>
          <button onclick="setTab('warikan')" class="flex-1 py-2 rounded-xl flex items-center justify-center gap-1.5 transition-all ${activeTab === 'warikan' ? 'bg-white text-emerald-700 shadow-sm' : 'text-slate-600'}">
            <i data-lucide="dollar-sign" class="w-3.5 h-3.5"></i> 割り勘・精算 (${expenses.length})
          </button>
        </div>
      `;

      if (activeTab === 'timeline') {
        html += renderTimelineTab(trip, daySpots, totalDays);
      } else {
        html += renderWarikanTab(trip, members, expenses, totalExpense, totalBudget, budgetDiff);
      }

      container.innerHTML = html;
    }

    // --- 2-A. Timeline Tab ---
    function renderTimelineTab(trip, daySpots, totalDays) {
      let html = `<div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200/80 mb-3">`;

      // Days Tabs
      html += `<div class="flex items-center gap-2 overflow-x-auto pb-2 mb-3 border-b border-slate-100">`;
      for (let i = 1; i <= totalDays; i++) {
        const isActive = activeDay === i;
        html += `
          <button onclick="selectDay(${i})" class="px-4 py-1.5 rounded-xl text-xs font-bold whitespace-nowrap transition-all ${isActive ? 'bg-sky-500 text-white shadow-sm' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}">
            ${i}日目
          </button>
        `;
      }
      html += `</div>`;

      // 1-Day Multi-stop Route URLs (Car vs Transit)
      const dayDuration = daySpots.reduce((s, spot) => s + (spot.duration_min || 0), 0);
      const dayEstimate = daySpots.reduce((s, spot) => s + (spot.cost_estimate || 0), 0);

      let multiRouteCarUrl = null;
      let multiRouteTransitUrl = null;
      if (daySpots.length >= 2) {
        const origin = daySpots[0].name.trim();
        const dest = daySpots[daySpots.length - 1].name.trim();
        let wpParam = '';
        if (daySpots.length > 2) {
          const waypoints = daySpots.slice(1, -1).map(s => s.name.trim()).join('|');
          wpParam = `&waypoints=${encodeURIComponent(waypoints)}`;
        }
        multiRouteCarUrl = `https://www.google.com/maps/dir/?api=1&origin=${encodeURIComponent(origin)}&destination=${encodeURIComponent(dest)}${wpParam}&travelmode=driving`;
        multiRouteTransitUrl = `https://www.google.com/maps/dir/?api=1&origin=${encodeURIComponent(origin)}&destination=${encodeURIComponent(dest)}${wpParam}&travelmode=transit`;
      }

      html += `
        <div class="bg-slate-50 rounded-xl p-3 mb-3 border border-slate-200/70">
          <div class="flex items-center justify-between text-xs text-slate-600 mb-2">
            <span><strong>${activeDay}日目</strong>: スポット ${daySpots.length}件 (滞在約${dayDuration}分)</span>
            ${dayEstimate > 0 ? `<span class="font-bold text-emerald-700">予定: ¥${dayEstimate.toLocaleString()}</span>` : ''}
          </div>
          ${multiRouteCarUrl ? `
            <div class="grid grid-cols-2 gap-2 mt-1">
              <a href="${multiRouteCarUrl}" target="_blank" rel="noopener" class="py-2 px-2.5 bg-amber-500 hover:bg-amber-600 text-white rounded-lg text-xs font-bold flex items-center justify-center gap-1 shadow-xs transition-colors">
                <i data-lucide="car" class="w-3.5 h-3.5"></i> 車で全ルート開く
                <i data-lucide="external-link" class="w-3 h-3"></i>
              </a>
              <a href="${multiRouteTransitUrl}" target="_blank" rel="noopener" class="py-2 px-2.5 bg-sky-500 hover:bg-sky-600 text-white rounded-lg text-xs font-bold flex items-center justify-center gap-1 shadow-xs transition-colors">
                <i data-lucide="train" class="w-3.5 h-3.5"></i> 電車でルート開く
                <i data-lucide="external-link" class="w-3 h-3"></i>
              </a>
            </div>
          ` : `
            <div class="text-[11px] text-slate-400 text-center">2箇所以上の登録で、1日の巡回ルートを一発でGoogleマップに展開できます</div>
          `}
        </div>
      `;

      // Spot List
      if (daySpots.length === 0) {
        html += `
          <div class="py-10 text-center text-slate-400 text-xs">
            <i data-lucide="map-pin" class="w-8 h-8 mx-auto mb-2 opacity-30 text-slate-400"></i>
            ${activeDay}日目のスポットは未登録です。下のボタンから追加してください。
          </div>
        `;
      } else {
        html += `<div class="space-y-3">`;
        daySpots.forEach((spot, idx) => {
          const nextSpot = daySpots[idx + 1];
          const cleanSpotName = spot.name.trim();
          const cleanNextSpotName = nextSpot ? nextSpot.name.trim() : '';
          const spotMode = spot.travel_mode || (spot.category === 'transit' ? 'transit' : 'driving');

          const navCurrentUrl = `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(cleanSpotName)}&travelmode=${spotMode}`;
          const searchUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(cleanSpotName)}`;

          html += `
            <div class="bg-slate-50/90 rounded-xl p-3 border border-slate-200">
              <div class="flex items-start gap-2.5">
                <div class="w-6 h-6 rounded-full bg-sky-500 text-white flex items-center justify-center font-bold text-xs shrink-0 mt-0.5">
                  ${idx + 1}
                </div>
                <div class="flex-1 min-w-0">
                  <div class="flex items-center gap-1.5 flex-wrap mb-0.5">
                    <h4 class="font-bold text-slate-800 text-sm truncate">${escapeHtml(spot.name)}</h4>
                    <span class="text-[10px] px-1.5 py-0.2 bg-white border border-slate-200 rounded text-slate-600">${getCategoryText(spot.category)}</span>
                  </div>
                  ${spot.memo ? `<p class="text-xs text-slate-500 mb-1.5">${escapeHtml(spot.memo)}</p>` : ''}
                  <div class="text-[11px] text-slate-400 flex items-center gap-3 mb-2">
                    <span>滞在約${spot.duration_min}分</span>
                    ${spot.cost_estimate > 0 ? `<span class="text-emerald-700 font-semibold">予算: ¥${spot.cost_estimate.toLocaleString()}</span>` : ''}
                  </div>

                  <!-- Google Maps Action Buttons -->
                  <div class="flex flex-wrap items-center gap-1.5 pt-1.5 border-t border-slate-200/60">
                    <a href="${navCurrentUrl}" target="_blank" rel="noopener" class="inline-flex items-center gap-1 px-2.5 py-1 bg-sky-600 hover:bg-sky-700 text-white rounded-md text-[11px] font-bold shadow-2xs">
                      <i data-lucide="navigation" class="w-3 h-3"></i> 現在地からナビ(${spotMode === 'driving' ? '車' : spotMode === 'walking' ? '徒歩' : '電車'})
                    </a>
                    <a href="${searchUrl}" target="_blank" rel="noopener" class="inline-flex items-center gap-1 px-2 py-1 bg-white text-slate-600 border border-slate-300 hover:bg-slate-50 rounded-md text-[11px]">
                      詳細 <i data-lucide="external-link" class="w-2.5 h-2.5"></i>
                    </a>
                    <button onclick="openAddExpenseModalWithPrefill('${escapeQuotes(spot.name)}', ${spot.cost_estimate || 0})" class="inline-flex items-center gap-1 px-2 py-1 bg-emerald-50 text-emerald-700 border border-emerald-200 hover:bg-emerald-100 rounded-md text-[11px] font-bold ml-auto">
                      <i data-lucide="dollar-sign" class="w-3 h-3"></i> 支出記録
                    </button>
                  </div>
                </div>

                <!-- Up/Down/Delete -->
                <div class="flex flex-col gap-1 shrink-0 ml-1">
                  <button onclick="moveSpot('${spot.id}', -1)" ${idx === 0 ? 'disabled class="opacity-20"' : ''} class="p-1 bg-white border border-slate-200 rounded text-slate-600 hover:bg-slate-100">
                    <i data-lucide="arrow-up" class="w-3 h-3"></i>
                  </button>
                  <button onclick="moveSpot('${spot.id}', 1)" ${idx === daySpots.length - 1 ? 'disabled class="opacity-20"' : ''} class="p-1 bg-white border border-slate-200 rounded text-slate-600 hover:bg-slate-100">
                    <i data-lucide="arrow-down" class="w-3 h-3"></i>
                  </button>
                  <button onclick="deleteSpot('${spot.id}')" class="p-1 bg-white border border-slate-200 rounded text-red-500 hover:bg-red-50">
                    <i data-lucide="trash-2" class="w-3 h-3"></i>
                  </button>
                </div>
              </div>
            </div>
          `;

          // Transit Segment between spots
          if (nextSpot) {
            const nextMode = spot.travel_mode || 'transit';
            const navNextUrl = `https://www.google.com/maps/dir/?api=1&origin=${encodeURIComponent(cleanSpotName)}&destination=${encodeURIComponent(cleanNextSpotName)}&travelmode=${nextMode}`;

            let modeBadgeStyle = 'bg-blue-50 text-blue-900 border-blue-200 hover:bg-blue-100';
            let modeIcon = '<i data-lucide="train" class="w-3.5 h-3.5 text-blue-600"></i>';
            let modeName = '🚆 電車';
            let modeLabel = '乗換案内';

            if (nextMode === 'driving') {
              modeBadgeStyle = 'bg-amber-50 text-amber-900 border-amber-300 hover:bg-amber-100';
              modeIcon = '<i data-lucide="car" class="w-3.5 h-3.5 text-amber-600"></i>';
              modeName = '🚗 車・レンタカー';
              modeLabel = '車ナビ';
            } else if (nextMode === 'walking') {
              modeBadgeStyle = 'bg-emerald-50 text-emerald-900 border-emerald-200 hover:bg-emerald-100';
              modeIcon = '<i data-lucide="footprints" class="w-3.5 h-3.5 text-emerald-600"></i>';
              modeName = '🚶 徒歩';
              modeLabel = '徒歩ルート';
            }

            html += `
              <div class="my-1.5 flex items-center justify-between p-2 bg-white rounded-xl border border-slate-200 shadow-2xs text-xs">
                <div class="flex items-center gap-1.5">
                  <span class="text-[10px] text-slate-400 font-bold">区間移動:</span>
                  <button onclick="toggleSpotTravelMode('${spot.id}')" class="px-2 py-0.5 rounded-md text-[11px] font-bold flex items-center gap-1 border transition-all ${modeBadgeStyle}" title="タップして移動手段（電車/車/徒歩）を切替">
                    ${modeIcon} <span>${modeName}</span>
                    <span class="text-[9px] text-slate-400">▼</span>
                  </button>
                </div>
                <a href="${navNextUrl}" target="_blank" rel="noopener" class="inline-flex items-center gap-1 px-2.5 py-1 bg-sky-50 hover:bg-sky-100 text-sky-700 rounded-lg text-[11px] font-bold transition-colors">
                  <span>${cleanSpotName} ➔ ${cleanNextSpotName}（${modeLabel}）</span>
                  <i data-lucide="arrow-right" class="w-3 h-3"></i>
                </a>
              </div>
            `;
          }
        });
        html += `</div>`;
      }

      // Add Spot Button
      html += `
        <button onclick="openAddSpotModal()" class="mt-4 w-full py-2.5 bg-sky-50 hover:bg-sky-100 text-sky-600 rounded-xl font-bold text-xs flex items-center justify-center gap-1.5 border border-dashed border-sky-300 transition-colors">
          <i data-lucide="plus" class="w-3.5 h-3.5"></i> ${activeDay}日目にスポットを追加
        </button>
      </div>`;

      return html;
    }

    // --- 2-B. Warikan & Expenses Tab ---
    function renderWarikanTab(trip, members, expenses, totalExpense, totalBudget, budgetDiff) {
      const itemizedLendings = calculateItemizedLendings(expenses, members);
      const settlements = calculateOptimalSettlements(expenses, members);
      const memberMap = new Map(members.map(m => [m.id, m.name]));

      let html = `
        <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200/80 mb-3">
          <!-- Summary Banner -->
          <div class="bg-gradient-to-br from-emerald-600 to-teal-700 rounded-xl p-4 text-white mb-3 shadow-sm">
            <div class="flex items-center justify-between mb-1.5">
              <div>
                <span class="text-xs text-emerald-100 font-medium">実績支出合計</span>
                <div class="text-2xl font-black tracking-tight mt-0.5">¥${totalExpense.toLocaleString()}</div>
              </div>
              <button onclick="openAddExpenseModal()" class="px-3.5 py-2 bg-white text-emerald-800 hover:bg-emerald-50 rounded-xl font-bold text-xs flex items-center gap-1.5 shadow-sm">
                <i data-lucide="plus" class="w-4 h-4"></i> 支出を記録
              </button>
            </div>
            ${totalBudget > 0 ? `
              <div class="pt-2 border-t border-emerald-500/50 flex items-center justify-between text-xs text-emerald-100">
                <span>予定予算: ¥${totalBudget.toLocaleString()}</span>
                <span class="font-bold ${budgetDiff >= 0 ? 'text-emerald-200' : 'text-amber-300'}">
                  ${budgetDiff >= 0 ? `残り ¥${budgetDiff.toLocaleString()}` : `超過 ¥${Math.abs(budgetDiff).toLocaleString()}`}
                </span>
              </div>
            ` : ''}
          </div>

          <!-- Sub Tab Switcher -->
          <div class="flex border-b border-slate-200 mb-3 text-xs font-bold">
            <button onclick="setWarikanSubTab('expenses')" class="flex-1 py-2 flex items-center justify-center gap-1 border-b-2 transition-all ${warikanSubTab === 'expenses' ? 'border-emerald-500 text-emerald-700' : 'border-transparent text-slate-400'}">
              <i data-lucide="receipt" class="w-3.5 h-3.5"></i> 支出一覧 (${expenses.length})
            </button>
            <button onclick="setWarikanSubTab('lendings')" class="flex-1 py-2 flex items-center justify-center gap-1 border-b-2 transition-all ${warikanSubTab === 'lendings' ? 'border-emerald-500 text-emerald-700' : 'border-transparent text-slate-400'}">
              <i data-lucide="user-check" class="w-3.5 h-3.5"></i> 立替明細 (${itemizedLendings.length})
            </button>
            <button onclick="setWarikanSubTab('settlement')" class="flex-1 py-2 flex items-center justify-center gap-1 border-b-2 transition-all ${warikanSubTab === 'settlement' ? 'border-emerald-500 text-emerald-700' : 'border-transparent text-slate-400'}">
              <i data-lucide="arrow-left-right" class="w-3.5 h-3.5"></i> 最終精算
            </button>
            <button onclick="setWarikanSubTab('members')" class="flex-1 py-2 flex items-center justify-center gap-1 border-b-2 transition-all ${warikanSubTab === 'members' ? 'border-emerald-500 text-emerald-700' : 'border-transparent text-slate-400'}">
              <i data-lucide="users" class="w-3.5 h-3.5"></i> メンバー (${members.length})
            </button>
          </div>
      `;

      // Sub-tab 1: Expenses List
      if (warikanSubTab === 'expenses') {
        if (expenses.length === 0) {
          html += `<div class="py-10 text-center text-slate-400 text-xs">まだ支出の記録はありません。「支出を記録」から追加してください。</div>`;
        } else {
          html += `<div class="space-y-2">`;
          expenses.forEach(e => {
            const payerName = memberMap.get(e.payer_id) || '自分';
            const targetNames = (e.splits || []).map(s => memberMap.get(s.member_id) || '不明').join(', ');
            const isAll = (e.splits || []).length === members.length;

            html += `
              <div class="p-3 bg-slate-50 rounded-xl border border-slate-200 flex items-center justify-between text-xs">
                <div class="min-w-0 pr-2">
                  <div class="flex items-center gap-1.5 mb-0.5">
                    <span class="font-bold text-slate-800 text-sm truncate">${escapeHtml(e.title)}</span>
                    <span class="text-[10px] px-1.5 py-0.2 bg-white border border-slate-200 rounded text-slate-500">${getCategoryText(e.category)}</span>
                  </div>
                  <div class="text-[11px] text-slate-500">
                    <strong class="text-emerald-700 font-semibold">${escapeHtml(payerName)}</strong> が支払
                    <span class="text-slate-400 ml-1.5">（対象: ${isAll ? `全員(${members.length}名)` : escapeHtml(targetNames)}）</span>
                  </div>
                </div>
                <div class="flex items-center gap-2 shrink-0">
                  <div class="text-right">
                    <div class="font-extrabold text-slate-800 text-sm">¥${e.amount.toLocaleString()}</div>
                    <div class="text-[10px] text-slate-400">${e.paid_date || ''}</div>
                  </div>
                  <button onclick="deleteExpense('${e.id}')" class="p-1.5 text-slate-300 hover:text-red-500 rounded-lg hover:bg-red-50">
                    <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                  </button>
                </div>
              </div>
            `;
          });
          html += `</div>`;
        }
      }

      // Sub-tab 2: Itemized Lendings
      else if (warikanSubTab === 'lendings') {
        html += `
          <div class="text-xs bg-emerald-50 border border-emerald-200 text-emerald-800 p-2.5 rounded-lg mb-2.5">
            💡「だれが」「だれの」分を立て替えたかの一覧明細です。
          </div>
        `;
        if (itemizedLendings.length === 0) {
          html += `<div class="py-10 text-center text-slate-400 text-xs">立替データはありません（各自で支払っているか、未登録です）。</div>`;
        } else {
          html += `<div class="space-y-2">`;
          itemizedLendings.forEach(item => {
            html += `
              <div class="p-3 bg-slate-50 rounded-xl border border-slate-200 flex items-center justify-between text-xs">
                <div>
                  <div class="font-bold text-slate-800 flex items-center gap-1.5">
                    <span class="text-emerald-700 bg-emerald-100 px-1.5 py-0.5 rounded text-xs font-semibold">${escapeHtml(item.payerName)}</span>
                    <i data-lucide="arrow-right" class="w-3 h-3 text-slate-400"></i>
                    <span class="text-sky-700 bg-sky-100 px-1.5 py-0.5 rounded text-xs font-semibold">${escapeHtml(item.beneficiaryName)}</span>
                  </div>
                  <div class="text-slate-500 text-[11px] mt-1">
                    用途: <strong class="text-slate-700">${escapeHtml(item.title)}</strong> (${item.date || ''})
                  </div>
                </div>
                <div class="text-right">
                  <span class="text-sm font-extrabold text-slate-800">¥${item.amount.toLocaleString()}</span>
                  <div class="text-[10px] text-slate-400">立替中</div>
                </div>
              </div>
            `;
          });
          html += `</div>`;
        }
      }

      // Sub-tab 3: Final Settlement
      else if (warikanSubTab === 'settlement') {
        html += `
          <div class="text-xs bg-slate-100 text-slate-600 p-2.5 rounded-lg mb-2.5">
            立替分をすべて相殺し、最小の送金回数で過不足なく割り勘を完了します。
          </div>
        `;
        if (settlements.length === 0) {
          html += `<div class="py-10 text-center text-slate-400 text-xs">全員の収支が一致しているか、精算の必要はありません。</div>`;
        } else {
          html += `<div class="space-y-2 mb-3">`;
          settlements.forEach(s => {
            html += `
              <div class="p-3 bg-emerald-50/70 border border-emerald-200 rounded-xl flex items-center justify-between text-xs font-bold">
                <div class="flex items-center gap-2">
                  <span class="bg-white px-2 py-1 border border-slate-200 rounded text-slate-700">${escapeHtml(s.fromName)}</span>
                  <i data-lucide="arrow-right" class="w-3.5 h-3.5 text-emerald-600"></i>
                  <span class="bg-emerald-600 px-2 py-1 rounded text-white">${escapeHtml(s.toName)}</span>
                </div>
                <div class="text-right">
                  <span class="text-base font-black text-emerald-800">¥${s.amount.toLocaleString()}</span>
                  <div class="text-[10px] text-emerald-600">送金</div>
                </div>
              </div>
            `;
          });
          html += `</div>`;
          html += `
            <button onclick="copySettlement()" class="w-full py-2.5 bg-slate-800 hover:bg-slate-900 text-white rounded-xl text-xs font-bold flex items-center justify-center gap-1.5 shadow-sm">
              <i data-lucide="copy" class="w-3.5 h-3.5"></i> 精算結果をコピー（LINE共有用）
            </button>
          `;
        }
      }

      // Sub-tab 4: Members Management
      else if (warikanSubTab === 'members') {
        html += `
          <div class="mb-3">
            <h4 class="text-xs font-bold text-slate-700 mb-2">参加メンバー一覧</h4>
            <div class="space-y-1.5 mb-3">
              ${members.map((m, idx) => `
                <div class="p-2.5 bg-slate-50 rounded-xl border border-slate-200 flex items-center justify-between text-xs">
                  <span class="font-bold text-slate-800 flex items-center gap-1.5">
                    <i data-lucide="user" class="w-3.5 h-3.5 text-emerald-600"></i> ${escapeHtml(m.name)}
                    ${m.is_creator ? '<span class="text-[10px] bg-slate-200 text-slate-600 px-1.5 py-0.2 rounded font-normal">作成者</span>' : ''}
                  </span>

    function copySetupSql() {
      const sql = `-- 1. trips テーブル
CREATE TABLE IF NOT EXISTS trips (
  id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
  share_token TEXT UNIQUE DEFAULT gen_random_uuid()::text,
  title TEXT NOT NULL,
  destination TEXT NOT NULL,
  start_date TEXT NOT NULL,
  end_date TEXT NOT NULL,
  travel_style TEXT DEFAULT 'standard',
  created_at TIMESTAMPTZ DEFAULT now()
);

-- 2. trip_members テーブル
CREATE TABLE IF NOT EXISTS trip_members (
  id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
  trip_id UUID REFERENCES trips(id) ON DELETE CASCADE,
  name TEXT NOT NULL,
  is_creator BOOLEAN DEFAULT false,
  created_at TIMESTAMPTZ DEFAULT now()
);

-- 3. spots テーブル
CREATE TABLE IF NOT EXISTS spots (
  id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
  trip_id UUID REFERENCES trips(id) ON DELETE CASCADE,
  day_number INTEGER DEFAULT 1,
  sort_order INTEGER DEFAULT 0,
  name TEXT NOT NULL,
  category TEXT DEFAULT 'sightseeing',
  memo TEXT DEFAULT '',
  travel_mode TEXT DEFAULT 'transit',
  duration_min INTEGER DEFAULT 60,
  cost_estimate INTEGER DEFAULT 0,
  created_at TIMESTAMPTZ DEFAULT now()
);

-- 4. expenses テーブル
CREATE TABLE IF NOT EXISTS expenses (
  id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
  trip_id UUID REFERENCES trips(id) ON DELETE CASCADE,
  title TEXT NOT NULL,
  amount INTEGER NOT NULL,
  category TEXT DEFAULT 'food',
  payer_id TEXT,
  paid_date TEXT,
  created_at TIMESTAMPTZ DEFAULT now()
);

-- 5. expense_splits テーブル
CREATE TABLE IF NOT EXISTS expense_splits (
  id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
  expense_id UUID REFERENCES expenses(id) ON DELETE CASCADE,
  member_id TEXT NOT NULL,
  allocated_amount INTEGER DEFAULT 0
);

-- RLS (Row Level Security) 設定
ALTER TABLE trips ENABLE ROW LEVEL SECURITY;
ALTER TABLE trip_members ENABLE ROW LEVEL SECURITY;
ALTER TABLE spots ENABLE ROW LEVEL SECURITY;
ALTER TABLE expenses ENABLE ROW LEVEL SECURITY;
ALTER TABLE expense_splits ENABLE ROW LEVEL SECURITY;

CREATE POLICY "Public all on trips" ON trips FOR ALL USING (true) WITH CHECK (true);
CREATE POLICY "Public all on trip_members" ON trip_members FOR ALL USING (true) WITH CHECK (true);
CREATE POLICY "Public all on spots" ON spots FOR ALL USING (true) WITH CHECK (true);
CREATE POLICY "Public all on expenses" ON expenses FOR ALL USING (true) WITH CHECK (true);
CREATE POLICY "Public all on expense_splits" ON expense_splits FOR ALL USING (true) WITH CHECK (true);

-- リアルタイム配信の有効化
ALTER PUBLICATION supabase_realtime ADD TABLE trips, trip_members, spots, expenses, expense_splits;`;

      navigator.clipboard.writeText(sql).then(() => {
        alert('SQLコードをクリップボードにコピーしました！\nSupabaseの「SQL Editor」を開き、貼り付けて「Run」を実行してください。');
      });
    }

    async function handleSaveExpense(e) {
      e.preventDefault();
      const title = document.getElementById('exp-title').value.trim();
      const amount = parseInt(document.getElementById('exp-amount').value, 10);
      const category = document.getElementById('exp-cat').value;
      const payerId = document.getElementById('exp-payer').value;
      const paidDate = document.getElementById('exp-date').value;

      const checkedBoxes = Array.from(document.querySelectorAll('input[name="target-members"]:checked'));
      const targetIds = checkedBoxes.map(b => b.value);

      if (!title || !amount || amount <= 0) return;
      if (targetIds.length === 0) {
        alert('割り勘の対象者を最低1人選択してください。');
        return;
      }

      // Calculate splits
      const baseShare = Math.floor(amount / targetIds.length);
      const remainder = amount % targetIds.length;
      const splits = targetIds.map((mid, idx) => ({
        member_id: mid,
        allocated_amount: baseShare + (idx === 0 ? remainder : 0)
      }));

      const data = getTripData(currentTripId);
      const newExpId = crypto.randomUUID ? crypto.randomUUID() : 'exp_' + Date.now();
      const newExp = {
        id: newExpId,
        trip_id: currentTripId,
        title,
        amount,
        category,
        payer_id: payerId,
        paid_date: paidDate,
        splits
      };
      data.expenses.push(newExp);
      saveTripData(currentTripId, data);

      // Cloud Sync
      if (isCloudSyncEnabled()) {
        try {
          const { splits: sps, ...expRow } = newExp;
          await supabaseClient.from('expenses').insert([expRow]);
          if (sps && sps.length > 0) {
            const splitsRows = sps.map(s => ({
              id: crypto.randomUUID ? crypto.randomUUID() : 'split_' + Math.random().toString(36).substr(2, 9),
              expense_id: newExpId,
              member_id: s.member_id,
              allocated_amount: s.allocated_amount
            }));
            await supabaseClient.from('expense_splits').insert(splitsRows);
          }
        } catch (err) {
          console.error('Cloud expense insert error:', err);
        }
      }

      closeModal();
      setWarikanSubTab('expenses');
      render();
    }

    async function handleSaveSpot(e) {
      e.preventDefault();
      const name = document.getElementById('spot-name').value.trim();
      const category = document.getElementById('spot-cat').value;
      const memo = document.getElementById('spot-memo').value.trim();
      const duration = parseInt(document.getElementById('spot-duration').value, 10) || 60;

      const travelMode = document.getElementById('spot-travel-mode')?.value || (category === 'transit' ? 'transit' : 'driving');

      if (!name) return;
      const data = getTripData(currentTripId);
      const daySpots = data.spots.filter(s => s.day_number === activeDay);

      const spotId = crypto.randomUUID ? crypto.randomUUID() : 'spot_' + Date.now();
      const newSpot = {
        id: spotId,
        trip_id: currentTripId,
        day_number: activeDay,
        sort_order: daySpots.length,
        name,
        category,
        memo,
        duration_min: duration,
        cost_estimate: cost,
        travel_mode: travelMode
      };

      data.spots.push(newSpot);
      saveTripData(currentTripId, data);

      if (isCloudSyncEnabled()) {
        try {
          await supabaseClient.from('spots').insert([newSpot]);
        } catch (err) {
          console.error('Cloud spot insert error:', err);
        }
      }

      closeModal();
      render();

    // Toggle Travel Mode between spots (transit -> driving -> walking -> transit)
    async function toggleSpotTravelMode(spotId) {
      const data = getTripData(currentTripId);
      const spot = data.spots.find(s => s.id === spotId);
      if (!spot) return;

      const current = spot.travel_mode || 'transit';
      if (current === 'transit') spot.travel_mode = 'driving';
      else if (current === 'driving') spot.travel_mode = 'walking';
      else spot.travel_mode = 'transit';

      saveTripData(currentTripId, data);

      if (isCloudSyncEnabled()) {
        try {
          await supabaseClient.from('spots').update({ travel_mode: spot.travel_mode }).eq('id', spot.id);
        } catch (e) {}
      }
      render();
    }

    // Spot Controls
    async function moveSpot(spotId, dir) {
      const data = getTripData(currentTripId);
      const daySpots = data.spots.filter(s => s.day_number === activeDay).sort((a, b) => a.sort_order - b.sort_order);
      const idx = daySpots.findIndex(s => s.id === spotId);
      if (idx < 0) return;
      const targetIdx = idx + dir;
      if (targetIdx < 0 || targetIdx >= daySpots.length) return;

      const cur = daySpots[idx];
      const target = daySpots[targetIdx];
      cur.sort_order = targetIdx;
      target.sort_order = idx;

      saveTripData(currentTripId, data);

      if (isCloudSyncEnabled()) {
        try {
          await supabaseClient.from('spots').update({ sort_order: targetIdx }).eq('id', cur.id);
          await supabaseClient.from('spots').update({ sort_order: idx }).eq('id', target.id);
        } catch (e) {}
      }
      render();
    }

    async function deleteSpot(spotId) {
      if (!confirm('このスポットを削除しますか？')) return;
      const data = getTripData(currentTripId);
      data.spots = data.spots.filter(s => s.id !== spotId);

      if (isCloudSyncEnabled()) {
        try {
          await supabaseClient.from('spots').delete().eq('id', spotId);
        } catch (e) {}

      if (!confirm('この支出記録を削除しますか？')) return;
      const data = getTripData(currentTripId);
      data.expenses = data.expenses.filter(e => e.id !== expId);

    // Member Management
    async function handleAddMember(e) {
      e.preventDefault();
      const input = document.getElementById('add-member-name');
      const name = input.value.trim();
      if (!name) return;

      const data = getTripData(currentTripId);
      if (data.members.some(m => m.name === name)) {
        alert('同名のメンバーが既に登録されています。');
        return;
      }
      const memId = crypto.randomUUID ? crypto.randomUUID() : 'mem_' + Date.now();
      const newMember = {
        id: memId,
        trip_id: currentTripId,
        name,
        is_creator: false
      };
      data.members.push(newMember);
      saveTripData(currentTripId, data);

      if (isCloudSyncEnabled()) {
        try {
          await supabaseClient.from('trip_members').insert([newMember]);
        } catch (e) {}
      }

      input.value = '';
      render();
    }

    async function deleteMember(memberId) {
      const data = getTripData(currentTripId);
      const m = data.members.find(x => x.id === memberId);
      if (!confirm(`「${m?.name}」をメンバーから削除しますか？`)) return;

      data.members = data.members.filter(x => x.id !== memberId);
      saveTripData(currentTripId, data);

      if (isCloudSyncEnabled()) {
        try {
          await supabaseClient.from('trip_members').delete().eq('id', memberId);
        } catch (e) {}
      }
      render();
    }

    // Create Trip Handler
    async function handleCreateTrip(e) {
      e.preventDefault();
      const dest = document.getElementById('form-dest').value.trim();
      const title = document.getElementById('form-title').value.trim() || `${dest}の旅`;
      const start = document.getElementById('form-start').value;
      const end = document.getElementById('form-end').value;
      const usePreset = document.getElementById('form-preset').checked;

      const memberNames = creationMembers.length > 0 ? creationMembers : ['自分'];

      const tripId = crypto.randomUUID ? crypto.randomUUID() : 'trip_' + Date.now();
      const shareToken = crypto.randomUUID ? crypto.randomUUID() : 'st_' + Date.now();

      const trip = {
        id: tripId,
        share_token: shareToken,
        title,
        destination: dest,
        start_date: start,
        end_date: end,
        travel_style: 'standard'
      };

      const members = memberNames.map((name, i) => ({
        id: crypto.randomUUID ? crypto.randomUUID() : 'mem_' + i + '_' + Date.now(),
        trip_id: tripId,
        name,
        is_creator: i === 0
      }));

      // Spots
      let spots = [];
      if (usePreset) {
        const cityKey = Object.keys(PRESETS).find(k => dest.includes(k)) || '福井';
        spots = (PRESETS[cityKey] || []).map((s, idx) => ({
          id: crypto.randomUUID ? crypto.randomUUID() : 'spot_' + idx + '_' + Date.now(),
          trip_id: tripId,
          day_number: 1,
          sort_order: idx,
          name: s.name,
          category: s.category,
          memo: s.memo,
          duration_min: s.duration,
          cost_estimate: s.cost,
          travel_mode: s.travel_mode || 'transit'
        }));
      }

      // Save to local cache
      saveTripData(tripId, { trip, members, spots, expenses: [] });
      const trips = getStoredTrips();
      setStoredTrips([trip, ...trips.filter(t => t.id !== tripId)]);

      // Cloud Sync
      if (isCloudSyncEnabled()) {
        try {
          await supabaseClient.from('trips').insert([trip]);
          if (members.length > 0) await supabaseClient.from('trip_members').insert(members);
          if (spots.length > 0) await supabaseClient.from('spots').insert(spots);
        } catch (err) {
          console.error('Cloud create trip error:', err);
        }
      }

      navigate('detail', tripId);
    }

    async function deleteTrip(id) {
      if (!confirm('この旅行プランを削除しますか？')) return;

      if (isCloudSyncEnabled()) {
        try {
          await supabaseClient.from('trips').delete().eq('id', id);
        } catch (e) {}
      }

      localStorage.removeItem(`trip_${id}`);
      localStorage.removeItem(`members_${id}`);
      localStorage.removeItem(`spots_${id}`);
      localStorage.removeItem(`expenses_${id}`);
      const trips = getStoredTrips().filter(t => t.id !== id);
      setStoredTrips(trips);
      render();
    }

    // Warikan Logic: Itemized Lendings
    function calculateItemizedLendings(expenses, members) {
      const memberMap = new Map(members.map(m => [m.id, m.name]));
      const lendings = [];
      for (const exp of expenses) {
        const payerName = memberMap.get(exp.payer_id) || '自分';
        if (!exp.splits) continue;
        for (const split of exp.splits) {
          if (split.member_id === exp.payer_id) continue;
          if (split.allocated_amount <= 0) continue;
          lendings.push({
            payerName,
            beneficiaryName: memberMap.get(split.member_id) || '不明',
            title: exp.title,
            amount: split.allocated_amount,
            date: exp.paid_date
          });
        }
      }
      return lendings;
    }

    // Warikan Logic: Optimal Settlements
    function calculateOptimalSettlements(expenses, members) {
      const memberMap = new Map(members.map(m => [m.id, m.name]));
      const balances = {};
      members.forEach(m => balances[m.id] = 0);

      for (const exp of expenses) {
        if (balances[exp.payer_id] !== undefined) balances[exp.payer_id] += exp.amount;
        if (exp.splits) {
          for (const split of exp.splits) {
            if (balances[split.member_id] !== undefined) balances[split.member_id] -= split.allocated_amount;
          }
        }
      }

      const creditors = [];
      const debtors = [];
      for (const [id, balance] of Object.entries(balances)) {
        if (balance > 0) creditors.push({ id, amount: balance });
        else if (balance < 0) debtors.push({ id, amount: -balance });
      }

      creditors.sort((a, b) => b.amount - a.amount);
      debtors.sort((a, b) => b.amount - a.amount);

      const settlements = [];
      let cIdx = 0, dIdx = 0;
      while (cIdx < creditors.length && dIdx < debtors.length) {
        const creditor = creditors[cIdx];
        const debtor = debtors[dIdx];
        const transferAmount = Math.min(creditor.amount, debtor.amount);

        if (transferAmount > 0) {
          settlements.push({
            fromName: memberMap.get(debtor.id) || '不明',
            toName: memberMap.get(creditor.id) || '不明',
            amount: Math.round(transferAmount)
          });
        }
        creditor.amount -= transferAmount;
        debtor.amount -= transferAmount;
        if (creditor.amount <= 0.01) cIdx++;
        if (debtor.amount <= 0.01) dIdx++;
      }
      return settlements;
    }

    function copySettlement() {
      const data = getTripData(currentTripId);
      const settlements = calculateOptimalSettlements(data.expenses, data.members);
      if (settlements.length === 0) return;
      const text = settlements.map(s => `・${s.fromName} → ${s.toName}：¥${s.amount.toLocaleString()}`).join('\n');
      const total = data.expenses.reduce((s, e) => s + e.amount, 0);
      const msg = `【${data.trip.title} 割り勘精算】\n総支出: ¥${total.toLocaleString()}\n\n▼ 清算送金リスト\n${text}`;
      navigator.clipboard.writeText(msg).then(() => alert('精算結果をコピーしました！LINE等に貼り付けて共有できます。'));
    }

    // Export & Import
    function exportBackup() {
      const data = getTripData(currentTripId);
      if (!data) return;
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `${data.trip.destination}_旅行データ.json`;
      a.click();
      URL.revokeObjectURL(url);
    }

    function handleImportBackup(e) {
      const file = e.target.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (evt) => {
        try {
          const json = JSON.parse(evt.target.result);
          if (json.trip && json.trip.id) {
            saveTripData(json.trip.id, json);
            const trips = getStoredTrips().filter(t => t.id !== json.trip.id);
            setStoredTrips([json.trip, ...trips]);
            alert(`「${json.trip.title}」を復元しました！`);
            render();
          } else {
            alert('無効なデータ形式です。');
          }
        } catch (err) { alert('読み込みに失敗しました。'); }
      };
      reader.readAsText(file);
    }

    function getCategoryText(cat) {
      switch (cat) {
        case 'food': return 'グルメ';
        case 'hotel': return '宿泊';
        case 'shopping': return '買物';
        case 'transit': return '交通';
        default: return '観光';
      }
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }
    function escapeQuotes(str) {
      if (!str) return '';
      return String(str).replace(/'/g, "\\'").replace(/"/g, '&quot;');
    }

    // --- App Lifecycle & URL Parameter Init ---
    async function initApp() {
      initSupabase();

      // Check URL parameters for ?trip=...
      const urlParams = new URLSearchParams(window.location.search);
      const tripToken = urlParams.get('trip');

      if (tripToken) {
        if (isCloudSyncEnabled()) {
          const cloudTrip = await loadTripFromCloud(tripToken);
          if (cloudTrip) {
            navigate('detail', cloudTrip.id);
            return;
          }
        }
        // Check local
        const trips = getStoredTrips();
        const localTrip = trips.find(t => t.id === tripToken || t.share_token === tripToken);
        if (localTrip) {
          navigate('detail', localTrip.id);
          return;
        } else if (!isCloudSyncEnabled()) {
          alert('共有された旅行プランを開くには、ヘッダーの「クラウド設定」からSupabaseの接続情報を入力してください。');
        }
      }

      render();
    }

    // Run on load
    initApp();
</script>
