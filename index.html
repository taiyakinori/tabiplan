<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TabiPlan - 旅程・Googleマップ連携・割り勘管理</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased min-h-screen">
  <div id="app" class="max-w-md mx-auto min-h-screen bg-slate-50 shadow-xl pb-16 flex flex-col">
    <!-- Header -->
    <header class="bg-white border-b border-slate-200 px-4 py-3 sticky top-0 z-30 flex items-center justify-between shadow-2xs">
      <div class="flex items-center gap-2 cursor-pointer" onclick="navigate('home')">
        <div class="w-8 h-8 rounded-xl bg-sky-500 text-white flex items-center justify-center font-black shadow-sm">
          <i data-lucide="compass" class="w-5 h-5"></i>
        </div>
        <div>
          <div class="flex items-center gap-1.5">
            <h1 class="font-black text-sm tracking-tight text-slate-800 leading-none">TabiPlan</h1>
            <span class="text-[9px] bg-emerald-100 text-emerald-800 px-1.5 py-0.2 rounded-full font-bold">v3.1（完全単体検索版）</span>
          </div>
          <span class="text-[10px] text-slate-400 font-medium">旅程・マップ・割り勘精算</span>
        </div>
      </div>
      <div id="header-actions" class="flex items-center gap-1.5"></div>
    </header>

    <!-- Main Content Area -->
    <main id="main-content" class="flex-1 p-4"></main>
  </div>

  <!-- Global Modal Container -->
  <div id="modal-container" class="hidden fixed inset-0 z-50 bg-black/50 flex items-center justify-center p-4"></div>

  <!-- App Script -->
  <script>
    // --- Preset Cities Data ---
    const PRESETS = {
      '京都': [
        { name: '清水寺', category: 'sightseeing', duration: 90, cost: 400, memo: '舞台からの眺望と音羽の滝' },
        { name: '錦市場', category: 'food', duration: 60, cost: 2000, memo: '京都の台所で食べ歩きランチ' },
        { name: '金閣寺', category: 'sightseeing', duration: 60, cost: 500, memo: '舎利殿の金箔の輝きを鑑賞' },
        { name: '伏見稲荷大社', category: 'sightseeing', duration: 90, cost: 0, memo: '千本鳥居の参道散策' }
      ],
      '金沢': [
        { name: '兼六園', category: 'sightseeing', duration: 90, cost: 320, memo: '日本三名園の回遊式庭園' },
        { name: '近江町市場', category: 'food', duration: 60, cost: 2500, memo: '新鮮な海鮮丼ランチ' },
        { name: '金沢21世紀美術館', category: 'sightseeing', duration: 90, cost: 1200, memo: 'スイミング・プールなど現代アート' },
        { name: 'ひがし茶屋街', category: 'sightseeing', duration: 60, cost: 1000, memo: '風情ある茶屋建築と金箔スイーツ' }
      ],
      '仙台': [
        { name: '仙台城跡', category: 'sightseeing', duration: 60, cost: 0, memo: '伊達政宗公騎馬像と市内展望' },
        { name: '仙台牛たん通り', category: 'food', duration: 60, cost: 2200, memo: '炭火焼きの極上牛たん定食' },
        { name: '瑞鳳殿', category: 'sightseeing', duration: 60, cost: 570, memo: '豪華絢爛な桃山様式の霊屋' },
        { name: '松島海岸・五大堂', category: 'sightseeing', duration: 120, cost: 1500, memo: '日本三景松島の遊覧船巡り' }
      ],
      '沖縄': [
        { name: '美ら海水族館', category: 'sightseeing', duration: 120, cost: 2180, memo: '黒潮の海大水槽のジンベエザメ' },
        { name: '国際通り', category: 'shopping', duration: 90, cost: 3000, memo: 'お土産散策と沖縄そば' },
        { name: '万座毛', category: 'sightseeing', duration: 45, cost: 100, memo: 'エメラルドグリーンの断崖絶景' }
      ],
      '東京': [
        { name: '浅草寺・雷門', category: 'sightseeing', duration: 75, cost: 0, memo: '仲見世通りと参拝' },
        { name: '築地場外市場', category: 'food', duration: 60, cost: 2500, memo: '名物海鮮丼や玉子焼き' },
        { name: '東京スカイツリー', category: 'sightseeing', duration: 90, cost: 2100, memo: '展望デッキからの眺望' }
      ]
    };

    // --- State Management ---
    let currentView = 'home';
    let currentTripId = null;
    let activeDay = 1;
    let activeTab = 'timeline'; // 'timeline' | 'warikan'
    let warikanSubTab = 'expenses'; // 'expenses' | 'lendings' | 'settlement' | 'members'

    // Form Temporary Members State (For Creation Screen)
    let creationMembers = ['自分', '彼女'];

    // LocalStorage Helper
    function getStoredTrips() {
      try {
        return JSON.parse(localStorage.getItem('tabiplan_trips') || '[]');
      } catch (e) { return []; }
    }
    function setStoredTrips(trips) {
      localStorage.setItem('tabiplan_trips', JSON.stringify(trips));
    }
    function getTripData(id) {
      try {
        const trip = JSON.parse(localStorage.getItem(`trip_${id}`));
        const members = JSON.parse(localStorage.getItem(`members_${id}`) || '[]');
        const spots = JSON.parse(localStorage.getItem(`spots_${id}`) || '[]');
        const expenses = JSON.parse(localStorage.getItem(`expenses_${id}`) || '[]');
        return { trip, members, spots, expenses };
      } catch (e) { return null; }
    }
    function saveTripData(id, data) {
      if (data.trip) localStorage.setItem(`trip_${id}`, JSON.stringify(data.trip));
      if (data.members) localStorage.setItem(`members_${id}`, JSON.stringify(data.members));
      if (data.spots) localStorage.setItem(`spots_${id}`, JSON.stringify(data.spots));
      if (data.expenses) localStorage.setItem(`expenses_${id}`, JSON.stringify(data.expenses));
    }

    // Navigation Router
    function navigate(view, tripId = null) {
      currentView = view;
      if (tripId) currentTripId = tripId;
      closeModal();
      render();
    }

    // --- Render Views ---
    function render() {
      const container = document.getElementById('main-content');
      const headerActions = document.getElementById('header-actions');
      headerActions.innerHTML = '';

      if (currentView === 'home') {
        renderHome(container);
      } else if (currentView === 'detail' && currentTripId) {
        renderDetail(container, headerActions);
      }
      lucide.createIcons();
    }

    // --- 1. Home View ---
    function renderHome(container) {
      const trips = getStoredTrips();
      let html = `
        <div class="mb-5 text-center pt-2">
          <h2 class="text-lg font-black text-slate-800">旅行計画・割り勘マネージャー</h2>
          <p class="text-xs text-slate-500 mt-0.5">誰が・誰の・何を支払ったかをスマートに管理</p>
        </div>
      `;

      if (trips.length > 0) {
        html += `
          <div class="mb-5">
            <h3 class="text-xs font-bold text-slate-600 mb-2 flex items-center gap-1.5">
              <i data-lucide="folder-kanban" class="w-3.5 h-3.5 text-sky-500"></i>
              保存済みの旅行プラン (${trips.length}件)
            </h3>
            <div class="space-y-2">
        `;
        trips.forEach(t => {
          html += `
            <div onclick="navigate('detail', '${t.id}')" class="p-3.5 bg-white rounded-2xl border border-slate-200 shadow-2xs hover:border-sky-300 cursor-pointer flex items-center justify-between transition-colors">
              <div class="min-w-0 pr-2">
                <div class="font-bold text-slate-800 text-sm truncate">${escapeHtml(t.title)}</div>
                <div class="text-[11px] text-slate-500 flex items-center gap-2 mt-0.5">
                  <span class="text-sky-600 font-semibold flex items-center gap-0.5"><i data-lucide="map-pin" class="w-2.5 h-2.5"></i>${escapeHtml(t.destination)}</span>
                  <span>•</span>
                  <span>${t.start_date}〜</span>
                </div>
              </div>
              <div class="flex items-center gap-1 shrink-0">
                <button onclick="event.stopPropagation(); deleteTrip('${t.id}')" class="p-1.5 text-slate-400 hover:text-red-500 rounded-lg hover:bg-red-50">
                  <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                </button>
                <span class="text-xs font-bold text-sky-600 bg-sky-50 px-2.5 py-1 rounded-lg flex items-center gap-1">
                  開く <i data-lucide="chevron-right" class="w-3.5 h-3.5"></i>
                </span>
              </div>
            </div>
          `;
        });
        html += `</div></div>`;
      }

      // New Trip Form
      const today = new Date().toISOString().split('T')[0];
      html += `
        <div class="bg-white rounded-3xl p-5 shadow-sm border border-slate-200">
          <h3 class="text-xs font-bold text-slate-800 mb-3 flex items-center gap-1.5">
            <i data-lucide="plus-circle" class="w-4 h-4 text-sky-500"></i> 新しい旅行を作成
          </h3>
          <form onsubmit="handleCreateTrip(event)" class="space-y-3.5 text-xs">
            <div>
              <label class="block font-semibold text-slate-700 mb-1">目的地</label>
              <input type="text" id="form-dest" required placeholder="例: 京都、金沢、仙台、沖縄、東京" value="京都" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl font-semibold text-xs focus:outline-none focus:border-sky-500">
            </div>
            <div>
              <label class="block font-semibold text-slate-700 mb-1">旅行タイトル (任意)</label>
              <input type="text" id="form-title" placeholder="例: 京都2泊3日旅行" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:outline-none focus:border-sky-500">
            </div>
            <div class="grid grid-cols-2 gap-2">
              <div>
                <label class="block font-semibold text-slate-700 mb-1">開始日</label>
                <input type="date" id="form-start" required value="${today}" class="w-full px-3 py-1.5 bg-slate-50 border border-slate-200 rounded-xl text-xs font-semibold focus:outline-none focus:border-sky-500">
              </div>
              <div>
                <label class="block font-semibold text-slate-700 mb-1">終了日</label>
                <input type="date" id="form-end" required value="${today}" class="w-full px-3 py-1.5 bg-slate-50 border border-slate-200 rounded-xl text-xs font-semibold focus:outline-none focus:border-sky-500">
              </div>
            </div>

            <!-- Participant Members Tag Input -->
            <div>
              <label class="block font-semibold text-slate-700 mb-1 flex items-center justify-between">
                <span>参加メンバー（割り勘・立替対象）</span>
                <span class="text-[10px] text-slate-400 font-normal">旅行作成後も追加・変更可能</span>
              </label>
              <div id="creation-members-tags" class="flex flex-wrap gap-1.5 mb-2">
                ${creationMembers.map((m, idx) => `
                  <span class="inline-flex items-center gap-1 px-2.5 py-1 rounded-lg bg-emerald-50 text-emerald-800 border border-emerald-200 font-bold text-xs">
                    <i data-lucide="user" class="w-3 h-3 text-emerald-600"></i> ${escapeHtml(m)}
                    ${creationMembers.length > 1 ? `
                      <button type="button" onclick="removeCreationMember(${idx})" class="hover:text-red-500 ml-0.5">
                        <i data-lucide="x" class="w-3 h-3"></i>
                      </button>
                    ` : ''}
                  </span>
                `).join('')}
              </div>
              <div class="flex gap-1.5">
                <input type="text" id="new-member-input" placeholder="メンバー名を追加（例: Aさん、友人）" class="flex-1 px-3 py-1.5 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:outline-none focus:border-sky-500">
                <button type="button" onclick="addCreationMember()" class="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl font-bold text-xs flex items-center gap-1 shadow-2xs">
                  <i data-lucide="plus" class="w-3.5 h-3.5"></i> 追加
                </button>
              </div>
            </div>

            <div class="pt-1">
              <label class="flex items-center gap-2 p-2.5 rounded-xl border border-slate-200 bg-slate-50 cursor-pointer">
                <input type="checkbox" id="form-preset" class="rounded text-sky-600">
                <div>
                  <span class="font-bold text-slate-700">主要観光スポットを初期セットする</span>
                  <div class="text-[10px] text-slate-400">代表スポットを自動で枠組み登録（後から自由に変更可能）</div>
                </div>
              </label>
            </div>
            <button type="submit" class="w-full mt-2 py-3 bg-sky-500 hover:bg-sky-600 text-white rounded-xl font-bold text-xs flex items-center justify-center gap-1.5 shadow-sm transition-colors">
              旅行プランを作成して開始 <i data-lucide="arrow-right" class="w-3.5 h-3.5"></i>
            </button>
          </form>

          <div class="mt-4 pt-3 border-t border-slate-100 flex items-center justify-between text-[11px] text-slate-400">
            <span>JSONバックアップ復元</span>
            <label class="cursor-pointer font-bold text-sky-600 hover:underline flex items-center gap-1">
              <i data-lucide="upload" class="w-3 h-3"></i> ファイル選択
              <input type="file" accept=".json" onchange="handleImportBackup(event)" class="hidden">
            </label>
          </div>
        </div>
      `;
      container.innerHTML = html;
    }

    function addCreationMember() {
      const input = document.getElementById('new-member-input');
      const val = input.value.trim();
      if (!val) return;
      if (!creationMembers.includes(val)) {
        creationMembers.push(val);
      }
      input.value = '';
      render();
    }
    function removeCreationMember(idx) {
      creationMembers.splice(idx, 1);
      render();
    }

    // --- 2. Detail View ---
    function renderDetail(container, headerActions) {
      const data = getTripData(currentTripId);
      if (!data || !data.trip) {
        navigate('home');
        return;
      }
      const { trip, members, spots, expenses } = data;

      // Header Actions
      headerActions.innerHTML = `
        <button onclick="exportBackup()" class="px-2.5 py-1 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-medium rounded-lg flex items-center gap-1">
          <i data-lucide="download" class="w-3 h-3"></i> 保存
        </button>
        <button onclick="navigate('home')" class="px-2.5 py-1 bg-sky-50 hover:bg-sky-100 text-sky-600 text-xs font-bold rounded-lg flex items-center gap-1">
          <i data-lucide="home" class="w-3 h-3"></i> 一覧
        </button>
      `;

      // Calculate total days
      const start = new Date(trip.start_date);
      const end = new Date(trip.end_date);
      const totalDays = Math.max(1, Math.ceil(Math.abs(end.getTime() - start.getTime()) / (1000 * 60 * 60 * 24)) + 1);
      if (activeDay > totalDays) activeDay = 1;

      // Filter day spots
      const daySpots = spots.filter(s => s.day_number === activeDay).sort((a, b) => a.sort_order - b.sort_order);

      // Calculations
      const totalExpense = expenses.reduce((sum, e) => sum + e.amount, 0);
      const totalBudget = spots.reduce((sum, s) => sum + (s.cost_estimate || 0), 0);
      const budgetDiff = totalBudget - totalExpense;

      let html = `
        <!-- Trip Info Card -->
        <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200/80 mb-3">
          <div class="flex items-start justify-between">
            <h2 class="text-base font-black text-slate-800">${escapeHtml(trip.title)}</h2>
            <button onclick="openEditTripModal()" class="text-slate-400 hover:text-sky-600 p-1">
              <i data-lucide="settings" class="w-3.5 h-3.5"></i>
            </button>
          </div>
          <div class="flex flex-wrap items-center gap-2 mt-2 text-xs text-slate-500 font-medium">
            <span class="text-sky-700 font-bold bg-sky-50 px-2 py-0.5 rounded-md flex items-center gap-1">
              <i data-lucide="map-pin" class="w-3 h-3 text-sky-500"></i> ${escapeHtml(trip.destination)}
            </span>
            <span class="flex items-center gap-1">
              <i data-lucide="calendar" class="w-3 h-3 text-slate-400"></i> ${trip.start_date}〜 (${totalDays}日間)
            </span>
            <button onclick="setTab('warikan'); setWarikanSubTab('members')" class="flex items-center gap-1 text-emerald-700 bg-emerald-50 hover:bg-emerald-100 px-2 py-0.5 rounded-md font-bold transition-colors">
              <i data-lucide="users" class="w-3 h-3 text-emerald-600"></i> ${members.length}名 (管理)
            </button>
          </div>
        </div>

        <!-- Main Tab Switcher -->
        <div class="flex bg-slate-200/80 p-1 rounded-2xl mb-3 font-bold text-xs">
          <button onclick="setTab('timeline')" class="flex-1 py-2 rounded-xl flex items-center justify-center gap-1.5 transition-all ${activeTab === 'timeline' ? 'bg-white text-sky-700 shadow-sm' : 'text-slate-600'}">
            <i data-lucide="list-ordered" class="w-3.5 h-3.5"></i> 旅程・マップ (${spots.length})
          </button>
          <button onclick="setTab('warikan')" class="flex-1 py-2 rounded-xl flex items-center justify-center gap-1.5 transition-all ${activeTab === 'warikan' ? 'bg-white text-emerald-700 shadow-sm' : 'text-slate-600'}">
            <i data-lucide="dollar-sign" class="w-3.5 h-3.5"></i> 割り勘・精算 (${expenses.length})
          </button>
        </div>
      `;

      if (activeTab === 'timeline') {
        html += renderTimelineTab(trip, daySpots, totalDays);
      } else {
        html += renderWarikanTab(trip, members, expenses, totalExpense, totalBudget, budgetDiff);
      }

      container.innerHTML = html;
    }

    // --- 2-A. Timeline Tab ---
    function renderTimelineTab(trip, daySpots, totalDays) {
      let html = `<div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200/80 mb-3">`;

      // Days Tabs
      html += `<div class="flex items-center gap-2 overflow-x-auto pb-2 mb-3 border-b border-slate-100">`;
      for (let i = 1; i <= totalDays; i++) {
        const isActive = activeDay === i;
        html += `
          <button onclick="selectDay(${i})" class="px-4 py-1.5 rounded-xl text-xs font-bold whitespace-nowrap transition-all ${isActive ? 'bg-sky-500 text-white shadow-sm' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}">
            ${i}日目
          </button>
        `;
      }
      html += `</div>`;

      // 1-Day Multi-stop Route Link
      const dayDuration = daySpots.reduce((s, spot) => s + (spot.duration_min || 0), 0);
      const dayEstimate = daySpots.reduce((s, spot) => s + (spot.cost_estimate || 0), 0);

      let multiRouteUrl = null;
      if (daySpots.length >= 2) {
        const origin = daySpots[0].name;
        const dest = daySpots[daySpots.length - 1].name;
        multiRouteUrl = `https://www.google.com/maps/dir/?api=1&origin=${encodeURIComponent(origin)}&destination=${encodeURIComponent(dest)}`;
        if (daySpots.length > 2) {
          const waypoints = daySpots.slice(1, -1).map(s => s.name).join('|');
          multiRouteUrl += `&waypoints=${encodeURIComponent(waypoints)}`;
        }
      }

      html += `
        <div class="bg-slate-50 rounded-xl p-3 mb-3 border border-slate-200/70">
          <div class="flex items-center justify-between text-xs text-slate-600 mb-2">
            <span><strong>${activeDay}日目</strong>: スポット ${daySpots.length}件 (滞在約${dayDuration}分)</span>
            ${dayEstimate > 0 ? `<span class="font-bold text-emerald-700">予定: ¥${dayEstimate.toLocaleString()}</span>` : ''}
          </div>
          ${multiRouteUrl ? `
            <a href="${multiRouteUrl}" target="_blank" rel="noopener" class="w-full py-2 px-3 bg-sky-500 hover:bg-sky-600 text-white rounded-lg text-xs font-bold flex items-center justify-center gap-1.5 shadow-sm">
              <i data-lucide="route" class="w-3.5 h-3.5"></i> ${activeDay}日目の巡回ルートを一括でGoogleマップで開く
              <i data-lucide="external-link" class="w-3 h-3"></i>
            </a>
          ` : `
            <div class="text-[11px] text-slate-400 text-center">2箇所以上の登録で、巡回ルートを一発でGoogleマップに展開できます</div>
          `}
        </div>
      `;

      // Spot List
      if (daySpots.length === 0) {
        html += `
          <div class="py-10 text-center text-slate-400 text-xs">
            <i data-lucide="map-pin" class="w-8 h-8 mx-auto mb-2 opacity-30 text-slate-400"></i>
            ${activeDay}日目のスポットは未登録です。下のボタンから追加してください。
          </div>
        `;
      } else {
        html += `<div class="space-y-2.5">`;
        daySpots.forEach((spot, idx) => {
          const nextSpot = daySpots[idx + 1];
          // Google Maps URLs: strictly using spot.name ONLY (never appending destination)
          const cleanSpotName = spot.name.trim();
          const cleanNextSpotName = nextSpot ? nextSpot.name.trim() : '';
          const navCurrentUrl = `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(cleanSpotName)}`;
          const navNextUrl = nextSpot ? `https://www.google.com/maps/dir/?api=1&origin=${encodeURIComponent(cleanSpotName)}&destination=${encodeURIComponent(cleanNextSpotName)}` : null;
          const searchUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(cleanSpotName)}`;

          html += `
            <div class="bg-slate-50/90 rounded-xl p-3 border border-slate-200">
              <div class="flex items-start gap-2.5">
                <div class="w-6 h-6 rounded-full bg-sky-500 text-white flex items-center justify-center font-bold text-xs shrink-0 mt-0.5">
                  ${idx + 1}
                </div>
                <div class="flex-1 min-w-0">
                  <div class="flex items-center gap-1.5 flex-wrap mb-0.5">
                    <h4 class="font-bold text-slate-800 text-sm truncate">${escapeHtml(spot.name)}</h4>
                    <span class="text-[10px] px-1.5 py-0.2 bg-white border border-slate-200 rounded text-slate-600">${getCategoryText(spot.category)}</span>
                  </div>
                  ${spot.memo ? `<p class="text-xs text-slate-500 mb-1.5">${escapeHtml(spot.memo)}</p>` : ''}
                  <div class="text-[11px] text-slate-400 flex items-center gap-3 mb-2">

    function openAddExpenseModalWithPrefill(title, cost) {
      setTab('warikan');
      openAddExpenseModal(title, cost);
    }

    function toggleAllTargets(checked) {
      const boxes = document.querySelectorAll('input[name="target-members"]');
      boxes.forEach(b => b.checked = checked);
    }

    function handleSaveExpense(e) {
      e.preventDefault();
      const title = document.getElementById('exp-title').value.trim();
      const amount = parseInt(document.getElementById('exp-amount').value, 10);
      const category = document.getElementById('exp-cat').value;
      const payerId = document.getElementById('exp-payer').value;
      const paidDate = document.getElementById('exp-date').value;

      const checkedBoxes = Array.from(document.querySelectorAll('input[name="target-members"]:checked'));
      const targetIds = checkedBoxes.map(b => b.value);

      if (!title || !amount || amount <= 0) return;
      if (targetIds.length === 0) {
        alert('割り勘の対象者を最低1人選択してください。');
        return;
      }

      // Calculate splits
      const baseShare = Math.floor(amount / targetIds.length);
      const remainder = amount % targetIds.length;
      const splits = targetIds.map((mid, idx) => ({
        member_id: mid,
        allocated_amount: baseShare + (idx === 0 ? remainder : 0)
      }));

      const data = getTripData(currentTripId);
      const newExp = {
        id: 'exp_' + Date.now(),
        title,
        amount,
        category,
        payer_id: payerId,
        paid_date: paidDate,
        splits
      };
      data.expenses.push(newExp);
      saveTripData(currentTripId, data);
      closeModal();
      setWarikanSubTab('expenses');
      render();
    }

                <input type="number" id="spot-duration" min="15" step="15" value="60" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:outline-none focus:border-sky-500">
              </div>
              <div>
                <label class="block font-semibold text-slate-700 mb-1">予算目安(円)</label>
                <input type="number" id="spot-cost" min="0" step="100" value="0" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:outline-none focus:border-sky-500">
              </div>
            </div>

            <div class="flex gap-2 pt-2">
              <button type="button" onclick="closeModal()" class="flex-1 py-2 bg-slate-100 text-slate-600 font-bold rounded-xl hover:bg-slate-200">
                キャンセル
              </button>
              <button type="submit" class="flex-1 py-2 bg-sky-500 hover:bg-sky-600 text-white font-bold rounded-xl shadow-sm">
                追加する
              </button>
            </div>
          </form>
        </div>
      `;
      lucide.createIcons();
    }

    function handleSaveSpot(e) {
      e.preventDefault();
      const name = document.getElementById('spot-name').value.trim();
      const category = document.getElementById('spot-cat').value;
      const memo = document.getElementById('spot-memo').value.trim();
      const duration = parseInt(document.getElementById('spot-duration').value, 10) || 60;
      const cost = parseInt(document.getElementById('spot-cost').value, 10) || 0;

      if (!name) return;
      const data = getTripData(currentTripId);
      const daySpots = data.spots.filter(s => s.day_number === activeDay);

      const newSpot = {
        id: 'spot_' + Date.now(),
        day_number: activeDay,
        sort_order: daySpots.length,
        name,
        category,
        memo,
        duration_min: duration,
        cost_estimate: cost
      };
      data.spots.push(newSpot);
      saveTripData(currentTripId, data);
      closeModal();
      render();
    }

    // --- Helpers & State Transitions ---
    function selectDay(day) {
      activeDay = day;
      render();
    }
    function setTab(tab) {
      activeTab = tab;
      render();
    }
    function setWarikanSubTab(subTab) {
      warikanSubTab = subTab;
      render();
    }

    // Spot Controls
    function moveSpot(spotId, dir) {
      const data = getTripData(currentTripId);
      const daySpots = data.spots.filter(s => s.day_number === activeDay).sort((a, b) => a.sort_order - b.sort_order);
      const idx = daySpots.findIndex(s => s.id === spotId);
      if (idx < 0) return;
      const targetIdx = idx + dir;
      if (targetIdx < 0 || targetIdx >= daySpots.length) return;

      const cur = daySpots[idx];
      const target = daySpots[targetIdx];
      cur.sort_order = targetIdx;
      target.sort_order = idx;

      saveTripData(currentTripId, data);
      render();
    }

    function deleteSpot(spotId) {
      if (!confirm('このスポットを削除しますか？')) return;
      const data = getTripData(currentTripId);
      data.spots = data.spots.filter(s => s.id !== spotId);
      saveTripData(currentTripId, data);
      render();
    }

    function deleteExpense(expId) {
      if (!confirm('この支出記録を削除しますか？')) return;
      const data = getTripData(currentTripId);
      data.expenses = data.expenses.filter(e => e.id !== expId);
      saveTripData(currentTripId, data);
      render();
    }

    // Member Management
    function handleAddMember(e) {
      e.preventDefault();
      const input = document.getElementById('add-member-name');
      const name = input.value.trim();
      if (!name) return;

      const data = getTripData(currentTripId);
      if (data.members.some(m => m.name === name)) {
        alert('同名のメンバーが既に登録されています。');
        return;
      }
      data.members.push({
        id: 'mem_' + Date.now(),
        name,
        is_creator: false
      });
      saveTripData(currentTripId, data);
      input.value = '';
      render();
    }

    function deleteMember(memberId) {
      const data = getTripData(currentTripId);
      const m = data.members.find(x => x.id === memberId);
      if (!confirm(`「${m?.name}」をメンバーから削除しますか？`)) return;

      data.members = data.members.filter(x => x.id !== memberId);
      saveTripData(currentTripId, data);
      render();
    }

    // Create Trip Handler
    function handleCreateTrip(e) {
      e.preventDefault();
      const dest = document.getElementById('form-dest').value.trim();
      const title = document.getElementById('form-title').value.trim() || `${dest}の旅`;
      const start = document.getElementById('form-start').value;
      const end = document.getElementById('form-end').value;
      const usePreset = document.getElementById('form-preset').checked;

      const memberNames = creationMembers.length > 0 ? creationMembers : ['自分'];

      const tripId = 'trip_' + Date.now();
      const trip = { id: tripId, title, destination: dest, start_date: start, end_date: end };
      const members = memberNames.map((name, i) => ({ id: 'mem_' + i + '_' + Date.now(), name, is_creator: i === 0 }));

      // Spots
      let spots = [];
      if (usePreset) {
        const cityKey = Object.keys(PRESETS).find(k => dest.includes(k)) || '京都';
        spots = (PRESETS[cityKey] || []).map((s, idx) => ({
          id: 'spot_' + idx + '_' + Date.now(),
          day_number: 1,
          sort_order: idx,
          name: s.name,
          category: s.category,
          memo: s.memo,
          duration_min: s.duration,
          cost_estimate: s.cost
        }));
      }

      saveTripData(tripId, { trip, members, spots, expenses: [] });

      const trips = getStoredTrips();
      setStoredTrips([trip, ...trips.filter(t => t.id !== tripId)]);

      navigate('detail', tripId);
    }

    function deleteTrip(id) {
      if (!confirm('この旅行プランを削除しますか？')) return;
      localStorage.removeItem(`trip_${id}`);
      localStorage.removeItem(`members_${id}`);
      localStorage.removeItem(`spots_${id}`);
      localStorage.removeItem(`expenses_${id}`);
      const trips = getStoredTrips().filter(t => t.id !== id);
      setStoredTrips(trips);
      render();
    }

    // Warikan Logic: Itemized Lendings
    function calculateItemizedLendings(expenses, members) {
      const memberMap = new Map(members.map(m => [m.id, m.name]));
      const lendings = [];
      for (const exp of expenses) {
        const payerName = memberMap.get(exp.payer_id) || '自分';
        if (!exp.splits) continue;
        for (const split of exp.splits) {
          if (split.member_id === exp.payer_id) continue;
          if (split.allocated_amount <= 0) continue;
          lendings.push({
            payerName,
            beneficiaryName: memberMap.get(split.member_id) || '不明',
            title: exp.title,
            amount: split.allocated_amount,
            date: exp.paid_date
          });
        }
      }
      return lendings;
    }

    // Warikan Logic: Optimal Settlements
    function calculateOptimalSettlements(expenses, members) {
      const memberMap = new Map(members.map(m => [m.id, m.name]));
      const balances = {};
      members.forEach(m => balances[m.id] = 0);

      for (const exp of expenses) {
        if (balances[exp.payer_id] !== undefined) balances[exp.payer_id] += exp.amount;
        if (exp.splits) {
          for (const split of exp.splits) {
            if (balances[split.member_id] !== undefined) balances[split.member_id] -= split.allocated_amount;
          }
        }
      }

      const creditors = [];
      const debtors = [];
      for (const [id, balance] of Object.entries(balances)) {
        if (balance > 0) creditors.push({ id, amount: balance });
        else if (balance < 0) debtors.push({ id, amount: -balance });
      }

      creditors.sort((a, b) => b.amount - a.amount);
      debtors.sort((a, b) => b.amount - a.amount);

      const settlements = [];
      let cIdx = 0, dIdx = 0;
      while (cIdx < creditors.length && dIdx < debtors.length) {
        const creditor = creditors[cIdx];
        const debtor = debtors[dIdx];
        const transferAmount = Math.min(creditor.amount, debtor.amount);

        if (transferAmount > 0) {
          settlements.push({
            fromName: memberMap.get(debtor.id) || '不明',
            toName: memberMap.get(creditor.id) || '不明',
            amount: Math.round(transferAmount)
          });
        }
        creditor.amount -= transferAmount;
        debtor.amount -= transferAmount;
        if (creditor.amount <= 0.01) cIdx++;
        if (debtor.amount <= 0.01) dIdx++;
      }
      return settlements;
    }

    function copySettlement() {
      const data = getTripData(currentTripId);
      const settlements = calculateOptimalSettlements(data.expenses, data.members);
      if (settlements.length === 0) return;
      const text = settlements.map(s => `・${s.fromName} → ${s.toName}：¥${s.amount.toLocaleString()}`).join('\n');
      const total = data.expenses.reduce((s, e) => s + e.amount, 0);
      const msg = `【${data.trip.title} 割り勘精算】\n総支出: ¥${total.toLocaleString()}\n\n▼ 清算送金リスト\n${text}`;
      navigator.clipboard.writeText(msg).then(() => alert('精算結果をコピーしました！LINE等に貼り付けて共有できます。'));
    }

    // Export & Import
    function exportBackup() {
      const data = getTripData(currentTripId);
      if (!data) return;
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `${data.trip.destination}_旅行データ.json`;
      a.click();
      URL.revokeObjectURL(url);
    }

    function handleImportBackup(e) {
      const file = e.target.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (evt) => {
        try {
          const json = JSON.parse(evt.target.result);
          if (json.trip && json.trip.id) {
            saveTripData(json.trip.id, json);
            const trips = getStoredTrips().filter(t => t.id !== json.trip.id);
            setStoredTrips([json.trip, ...trips]);
            alert(`「${json.trip.title}」を復元しました！`);
            render();
          } else {
            alert('無効なデータ形式です。');
          }
        } catch (err) { alert('読み込みに失敗しました。'); }
      };
      reader.readAsText(file);
    }

    function getCategoryText(cat) {
      switch (cat) {
        case 'food': return 'グルメ';
        case 'hotel': return '宿泊';
        case 'shopping': return '買物';
        case 'transit': return '交通';
        default: return '観光';
      }
    }

    function formatMapQuery(spotName, destination) {
      if (!spotName) return '';
      if (!destination || spotName.includes(destination)) return spotName;
      return `${spotName} ${destination}`;
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }
    function escapeQuotes(str) {
      if (!str) return '';
      return String(str).replace(/'/g, "\\'").replace(/"/g, '&quot;');
    }

    // Initial render
    render();
  </script>
</body>
